name: Validate dashboards

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each dashboards branch is checked by the kubeapi branch of the same
        # name. The nightly run covers all three, because a kubeapi schema change
        # can break a dashboard that nobody touched.
        branch: ${{ fromJSON(github.event_name == 'schedule' && '["dev","test","main"]' || format('["{0}"]', github.base_ref || github.ref_name)) }}
    steps:
      - name: Check out dashboards
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && matrix.branch || '' }}
          path: dashboards

      - name: Check out the base branch for version checks
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Check out kubeapi
        uses: actions/checkout@v4
        with:
          repository: kubesense-ai/kubeapi
          ref: ${{ matrix.branch }}
          path: kubeapi
          token: ${{ secrets.KUBEAPI_READ_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: kubeapi/go.mod
          cache-dependency-path: kubeapi/go.sum

      - name: Build the checker
        working-directory: kubeapi
        run: go build -o "$RUNNER_TEMP/dashboard-validate" ./cmd/dashboard-validate

      - name: Validate
        run: |
          args=(-dir dashboards)
          if [ -d base ]; then args+=(-base base); fi
          "$RUNNER_TEMP/dashboard-validate" "${args[@]}"
